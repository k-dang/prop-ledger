name: Record specification approval

# Merging a spec/issue-<n> pull request is Design Approval. Remove the routing
# label and leave the issue open and queued: ready-to-implement is a separate
# decision. Inert until the repository variable SPEC_WORKFLOW_ENABLED is "true".
on:
  pull_request:
    types: [closed]

jobs:
  approve:
    name: Remove ready-to-spec and leave the issue queued
    if: vars.SPEC_WORKFLOW_ENABLED == 'true' && github.event.pull_request.merged && github.event.pull_request.base.ref == github.event.repository.default_branch && startsWith(github.event.pull_request.head.ref, 'spec/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write

    steps:
      - name: Record Design Approval on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number="${HEAD_REF#spec/issue-}"
          if ! [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Branch $HEAD_REF does not name an issue" >&2
            exit 1
          fi

          gh issue edit "$issue_number" --repo "$REPO" --remove-label 'ready-to-spec'

          marker='<!-- opencode-spec-status -->'
          body="$(printf '%s\n<!-- opencode-spec-outcome: approved -->\n\n%s\n\n%s\n\n[Actions run](%s)' \
            "$marker" \
            "Design approved: $PR_URL merged. The issue stays open and queued; apply \`ready-to-implement\` to authorize implementation." \
            "To change the approved design, open a normal documentation pull request against the specification; stop any running implementation first. A child issue that shares this design must name \`specs/issue-$issue_number/\` in its body." \
            "$RUN_URL")"
          comment_ids="$(gh api --paginate "repos/$REPO/issues/$issue_number/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and ((.body // \"\") | contains(\"$marker\"))) | .id")"
          comment_count="$(printf '%s\n' "$comment_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          case "$comment_count" in
            0)
              gh issue comment "$issue_number" --repo "$REPO" --body "$body"
              ;;
            1)
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_ids" \
                -f "body=$body" > /dev/null
              ;;
            *)
              echo "Refusing to update $comment_count trusted specification status comments" >&2
              exit 1
              ;;
          esac
