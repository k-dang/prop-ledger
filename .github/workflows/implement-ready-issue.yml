name: Implement ready issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue currently labeled ready-to-implement
        required: true
        type: string

concurrency:
  group: implement-${{ github.repository }}-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue and open pull request
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ready-to-implement' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      IMPLEMENTATION_BRANCH: automation/issue-${{ inputs.issue_number || github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      # ready-to-implement is Implementation Authorization. It cannot bypass
      # Design Approval: an issue with specification work must have that
      # specification merged on the default branch with its questions resolved.
      - name: Check eligibility and Design Approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Issue number must be a positive integer" >&2
            exit 1
          fi
          issue="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json state,labels,body)"
          if ! jq -e '.state == "OPEN" and any(.labels[]; .name == "ready-to-implement")' <<< "$issue" > /dev/null; then
            echo "Issue #$ISSUE_NUMBER is not open and labeled ready-to-implement" >&2
            exit 1
          fi

          blocked=''
          spec_pr="$(gh pr list --repo "$REPO" --state open --head "spec/issue-$ISSUE_NUMBER" --json url --jq '.[0].url // empty')"
          if jq -e 'any(.labels[]; .name == "ready-to-spec")' <<< "$issue" > /dev/null; then
            blocked="Issue #$ISSUE_NUMBER is still labeled \`ready-to-spec\`, so its design is not approved."
          elif [ -n "$spec_pr" ]; then
            blocked="Specification pull request $spec_pr is not merged."
          else
            spec_dirs="$( { [ -d "specs/issue-$ISSUE_NUMBER" ] && echo "specs/issue-$ISSUE_NUMBER"; jq -r '.body // ""' <<< "$issue" | grep -oE 'specs/issue-[1-9][0-9]*' || true; } | sort -u)"
            for spec_dir in $spec_dirs; do
              if ! [ -f "$spec_dir/PRODUCT.md" ] || ! [ -f "$spec_dir/TECH.md" ]; then
                blocked="Referenced specification \`$spec_dir/\` is not merged on \`$DEFAULT_BRANCH\`."
                break
              fi
              if grep -qE '\*\*Open question:\*\*|^## Open questions' "$spec_dir/PRODUCT.md" "$spec_dir/TECH.md"; then
                blocked="Specification \`$spec_dir/\` still contains open questions."
                break
              fi
            done
          fi

          if [ -n "$blocked" ]; then
            # Withdraw the authorization so the issue carries no routing label
            # and re-applying ready-to-implement after approval fires a new run.
            echo "Blocked: $blocked"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label 'ready-to-implement'
            printf 'blocked=%s\n' "$blocked" >> "$GITHUB_OUTPUT"
          fi

      - name: Create implementation branch from latest default branch
        if: steps.gate.outputs.blocked == ''
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git switch --create "$IMPLEMENTATION_BRANCH" "$base_sha"
          printf 'IMPLEMENTATION_BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"

      - name: Install pnpm
        if: steps.gate.outputs.blocked == ''
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Set up Node.js
        if: steps.gate.outputs.blocked == ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.blocked == ''
        run: pnpm install --frozen-lockfile

      - name: Install OpenCode
        if: steps.gate.outputs.blocked == ''
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Implement issue with OpenCode
        if: steps.gate.outputs.blocked == ''
        id: implement
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com --force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          opencode run \
            --model vercel/meta/muse-spark-1.3-contributor \
            --title "Issue $ISSUE_NUMBER implementation" \
            "Load and follow the skill named implement-ready-issue. Implement issue #$ISSUE_NUMBER in $REPO and carry it through to a review-ready pull request. Use the provided IMPLEMENTATION_BRANCH, DEFAULT_BRANCH, and RUN_URL environment values exactly; do not infer or replace them."

      - name: Upload visible-behavior evidence
        if: ${{ !cancelled() && hashFiles('.implementation/evidence/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: implementation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .implementation/evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify implementation outcome
        id: outcome
        if: ${{ !cancelled() && steps.implement.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- opencode-implementation-status -->'
          comment_ids="$(gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and ((.body // \"\") | contains(\"$marker\"))) | .id")"
          comment_count="$(printf '%s\n' "$comment_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$comment_count" != '1' ]; then
            echo "Expected exactly one trusted implementation status comment, found $comment_count" >&2
            exit 1
          fi

          comment_body="$(gh api "repos/$REPO/issues/comments/$comment_ids" --jq '.body')"
          blocked='false'
          published='false'
          if [[ "$comment_body" = *'<!-- opencode-implementation-outcome: blocked -->'* ]]; then
            blocked='true'
          fi
          if [[ "$comment_body" = *'<!-- opencode-implementation-outcome: published -->'* ]]; then
            published='true'
          fi
          if [ "$blocked" = "$published" ]; then
            echo "Implementation status must contain exactly one terminal outcome" >&2
            exit 1
          fi

          if [ "$blocked" = 'true' ]; then
            if gh api "repos/$REPO/git/ref/heads/$IMPLEMENTATION_BRANCH" > /dev/null 2>&1; then
              echo "Blocked implementation unexpectedly published $IMPLEMENTATION_BRANCH" >&2
              exit 1
            fi
            # Withdraw the authorization, as the gate does, so re-applying the label fires a new run.
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label 'ready-to-implement'
            exit 0
          fi

          pull_requests="$(gh pr list --repo "$REPO" --state open --head "$IMPLEMENTATION_BRANCH" \
            --json baseRefName,headRefName,isDraft)"
          if ! jq -e --arg base "$DEFAULT_BRANCH" --arg head "$IMPLEMENTATION_BRANCH" \
            'length == 1 and .[0].baseRefName == $base and .[0].headRefName == $head and (.[0].isDraft | not)' \
            <<< "$pull_requests" > /dev/null; then
            echo "Expected one review-ready pull request from $IMPLEMENTATION_BRANCH to $DEFAULT_BRANCH" >&2
            exit 1
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$IMPLEMENTATION_BRANCH" --jq '.object.sha')"
          parent_shas="$(gh api "repos/$REPO/commits/$head_sha" --jq '.parents | map(.sha) | @tsv')"
          if [ "$parent_shas" != "$IMPLEMENTATION_BASE_SHA" ]; then
            echo "Implementation branch is not exactly one commit on the recorded default-branch base" >&2
            exit 1
          fi

          verify_url="$(gh run list --repo "$REPO" --workflow verify.yml --event workflow_dispatch \
            --branch "$IMPLEMENTATION_BRANCH" --limit 20 --json headSha,url \
            | jq -r --arg head "$head_sha" 'map(select(.headSha == $head)) | first | .url // empty')"
          if [ -z "$verify_url" ]; then
            echo "Verify was not dispatched for $IMPLEMENTATION_BRANCH at $head_sha" >&2
            exit 1
          fi

          echo "Verified published implementation and dispatched $verify_url"

      - name: Record a blocked or failed attempt
        if: ${{ !cancelled() && (steps.gate.outputs.blocked != '' || steps.implement.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.gate.outputs.blocked }}
        run: |
          set -euo pipefail
          marker='<!-- opencode-implementation-status -->'
          if [ -n "$BLOCKED" ]; then
            body="$(printf '%s\n<!-- opencode-implementation-outcome: blocked -->\n\n%s\n\n%s\n\n%s' \
              "$marker" \
              "Implementation is blocked before Design Approval: $BLOCKED" \
              'The `ready-to-implement` label was removed. Merge the specification with its questions resolved, then apply `ready-to-implement` again. No branch or pull request was created.' \
              "[Actions run]($RUN_URL)")"
          else
            body="$(printf '%s\n\n%s\n\n%s' \
              "$marker" \
              'Implementation stopped unexpectedly. Check for a linked branch or pull request before rerunning.' \
              "See the [Actions run]($RUN_URL) for operational details and recovery context.")"
          fi
          comment_ids="$(gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and ((.body // \"\") | contains(\"$marker\"))) | .id")"
          comment_count="$(printf '%s\n' "$comment_ids" | sed '/^$/d' | wc -l | tr -d ' ')"

          case "$comment_count" in
            0)
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"
              ;;
            1)
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_ids" \
                -f "body=$body" > /dev/null
              ;;
            *)
              echo "Refusing to update $comment_count trusted implementation status comments" >&2
              exit 1
              ;;
          esac
