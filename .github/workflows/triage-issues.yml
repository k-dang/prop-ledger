name: Triage newly opened issues

on:
  issues:
    types: [opened]

concurrency:
  group: triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Run read-only triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.result.outputs.result }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Fetch issue context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .triage
          gh issue view "$ISSUE_NUMBER" --repo "$REPO" \
            --json number,title,body,comments,labels,author,createdAt,updatedAt,url \
            > .triage/issue.json
          gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,body,labels,author,updatedAt,url \
            > .triage/related-issues.json
          jq -n \
            --slurpfile issue .triage/issue.json \
            --slurpfile related .triage/related-issues.json \
            '{issue: $issue[0], relatedOpenIssues: ($related[0] | map(select(.number != $issue[0].number)))}' \
            > .triage/issue-context.json

      - name: Run OpenCode triage
        timeout-minutes: 10
        run: |
          pnpm dlx opencode-ai@1.17.7 run \
            --agent triage \
            --model opencode/north-mini-code-free \
            --format json \
            --title "Issue ${{ github.event.issue.number }} triage" \
            "Use the skill tool to load the skill named triage before doing any analysis. Then read .triage/issue-context.json and return the JSON decision only." \
            > .triage/opencode-events.jsonl

      - name: Export and log triage decision
        id: result
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          result="$(jq -ers '
            [ .[] | select(.type == "text") | .part.text ] |
            if length == 1 then .[0] else error("expected exactly one result") end
          ' .triage/opencode-events.jsonl)"
          normalized_result="$(printf '%s' "$result" | jq -cer '
            if
              type == "object" and
              (.label == "ready-to-implement" or
               .label == "ready-to-spec" or
               .label == "needs-info" or
               .label == "wait-to-implement") and
              (.comment | type == "string" and length > 0)
            then {label, comment}
            else error("invalid triage result")
            end
          ')"
          label="$(printf '%s' "$normalized_result" | jq -r '.label')"

          printf 'Triage result: %s\n' "$normalized_result"

          printf 'result=%s\n' "$normalized_result" >> "$GITHUB_OUTPUT"

          {
            echo "### Read-only triage decision"
            echo
            echo "- Issue: #$ISSUE_NUMBER"
            echo "- Suggested label: \`$label\`"
            echo "- OpenCode mutation: none; a separate job applies this decision"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply triage decision
    needs: triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Apply label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}
        run: |
          set -euo pipefail
          printf '%s' "$TRIAGE_RESULT" > triage-result.json
          label="$(jq -r '.label' triage-result.json)"
          current_labels="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')"

          for old_label in ready-to-implement ready-to-spec needs-info wait-to-implement; do
            if [ "$old_label" != "$label" ] && printf '%s\n' "$current_labels" | grep -Fxq "$old_label"; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$old_label"
            fi
          done

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$label"
          jq -r '.comment' triage-result.json > triage-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file triage-comment.md
