name: Draft specification for ready-to-spec issue

# Started by a ready-to-spec label event, triage's explicit dispatch, or a manual
# dispatch. The agent owns intake, the specification documents, and the pull
# request handoff; it follows .opencode/skills/spec/SKILL.md.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue currently labeled ready-to-spec
        required: true
        type: string

concurrency:
  group: spec-${{ github.repository }}-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    name: Draft specifications and open a pull request
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-to-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SPEC_BRANCH: spec/issue-${{ inputs.issue_number || github.event.issue.number }}
      SPEC_DIR: specs/issue-${{ inputs.issue_number || github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Draft specifications with OpenCode
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com --force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          opencode run \
            --model vercel/openai/gpt-5.6-luna \
            --title "Issue $ISSUE_NUMBER specification" \
            "Use the skill tool to load the skill named spec before doing any analysis. Then draft the specifications for issue #$ISSUE_NUMBER in $REPO and carry them through to a pull request. Use the provided SPEC_BRANCH, SPEC_DIR, and RUN_URL environment values exactly; do not infer or replace them."
