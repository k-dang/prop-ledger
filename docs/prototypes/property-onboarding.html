  const el = ev.target.closest("[data-bind]"); if (!el) return;
  const s = S(), path = el.dataset.bind;
  set(s, path, el.value);
  if (path === "property.name") s.nameTouched = true;
  if (path === "property.line1" && !s.nameTouched) {
    s.property.name = el.value;
    const nameEl = document.getElementById(fid("property.name")); if (nameEl) nameEl.value = el.value;
  }
  if (s.errors[path]) {
    delete s.errors[path];
    el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby");
    document.getElementById(fid(path) + "-err")?.remove();
  }
  if (/^owners\.\d+\.share$/.test(path)) {
    delete s.errors.shares;
    const m = document.getElementById("share-meter");
    if (m) { document.getElementById(fid("shares") + "-err")?.remove(); m.outerHTML = shareMeter(s); }
  }
}
// Date pickers can commit through "change" without an "input" event.
document.addEventListener("input", onBind);
document.addEventListener("change", onBind);
document.addEventListener("change", (ev) => {
  const f = ev.target.closest("[data-file]");
  if (f && f.files[0]) handleFile(Number(f.dataset.file), f.files[0]);
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, s = S(), kind = form.dataset.form;
  if (kind === "a") {
    if (!applyErrors(s, A_STEPS[s.step].validate(s))) return render({ focus: "error" });
    s.step++; render({ focus: "heading" });
  } else if (kind === "b") {
    const seq = bSequence(s), [key, idx] = seq[s.step].split(":");
    if (!applyErrors(s, B_Q[key].validate(s, idx == null ? undefined : Number(idx)))) return render({ focus: "error" });
    s.step++; render({ focus: "heading" });
  } else if (kind === "c") {
    const id = form.dataset.task, t = C_TASKS.find((x) => x.id === id);
    if (!applyErrors(s, t.validate(s))) return render({ focus: "error" });
    s.cDone[id] = true;
    s.cOpen = C_TASKS.find((x) => !s.cDone[x.id])?.id ?? null;
    render({ focus: s.cOpen ? "heading" : ".setup-head h2" });
    announce(`${t.title} saved.`);
  } else if (kind === "d") {
    const seq = dSequence(s), [key, idx] = seq[s.step].split(":");
    if (!applyErrors(s, D_Q[key].validate(s, idx == null ? undefined : Number(idx)))) return render({ focus: "error" });
    // After the first full pass, Continue returns to review (via any screen an edit broke).
    dGo(s, s.dSecMax === D_SECTIONS.length - 1 ? dFirstIncomplete(s) : s.step + 1);
    render({ focus: "heading" });
  } else if (kind === "sheet") {
    if (!applyErrors(s, vProperty(s))) return render({ focus: "error" });
    s.property.name = s.property.line1;
    create(s, () => { s.sheetOpen = false; s.phase = "page"; s.cOpen = "units"; });
  }
});

const ACTIONS = {
  start(s) {
    if (current === "c") { sheetTrigger = document.activeElement; s.sheetOpen = true; s.errors = {}; return render({ focus: "heading" }); }
    s.phase = "flow"; s.step = 0; render({ focus: "heading" });
  },
  restart() { states[current] = freshState(); render({ focus: "heading" }); },
  back(s) { s.errors = {}; s.save = "idle"; s.step = Math.max(0, s.step - 1); render({ focus: "heading" }); },
  goto(s, arg) { s.errors = {}; s.save = "idle"; s.step = Number(arg); render({ focus: "heading" }); },
  jump(s, arg) { s.errors = {}; s.save = "idle"; s.step = (current === "d" ? dSequence(s) : bSequence(s)).indexOf(arg); render({ focus: "heading" }); },
  "save-later"(s) { s.errors = {}; create(s, () => { s.phase = "partial"; }); },
  resume(s) { s.phase = "flow"; s.errors = {}; dGo(s, dFirstIncomplete(s)); render({ focus: "heading" }); },
  "owner-mode"(s, arg) {
    setOwnerMode(s, arg); delete s.errors.ownerMode;
    if (current === "b" && bSequence(s)[s.step] === "owners") { s.step++; return render({ focus: "heading" }); }
    render({ focus: current === "b" ? `#${fid("owners.0.share")}` : `[data-action='owner-mode'][data-arg='${arg}']` });
  },
  layout(s, arg) {
    setLayout(s, arg); delete s.errors.layout; delete s.errors.units;
    if (current === "b") { s.step++; return render({ focus: "heading" }); }
    render({ focus: `[data-action='layout'][data-arg='${arg}']` });
  },
  "add-owner"(s) { s.owners.push(newOwner()); delete s.errors.shares; render({ focus: `#${fid(`owners.${s.owners.length - 1}.name`)}` }); },
  "remove-owner"(s, arg) { s.owners.splice(Number(arg), 1); s.errors = {}; render({ focus: "[data-action='add-owner']" }); },
  "add-unit"(s) { s.units.push(newUnit(`Unit ${s.units.length + 1}`)); delete s.errors.units; render({ focus: `#${fid(`units.${s.units.length - 1}.label`)}` }); },
  "remove-unit"(s, arg) { s.units.splice(Number(arg), 1); s.errors = {}; render({ focus: "[data-action='add-unit']" }); },
  rented(s, arg) {
    const [i, v] = arg.split(":"); s.units[i].rented = v === "yes"; delete s.errors[`units.${i}.rented`];
    render({ focus: `[data-action='rented'][data-arg='${arg}']` });
  },
  "rented-q"(s, arg) {
    const i = Number(bSequence(s)[s.step].split(":")[1]);
    s.units[i].rented = arg === "yes"; s.errors = {}; s.step++; render({ focus: "heading" });
  },
  "pick-file"(s, arg) { document.querySelector(`[data-file='${arg}']`)?.click(); },
  "remove-doc"(s, arg) { s.units[arg].doc = null; render({ focus: `[data-action='pick-file'][data-arg='${arg}']` }); },
  create(s) {
    const e = current === "b" || current === "d" ? vProperty(s, ["property.name"]) : {};
    if (!applyErrors(s, e)) return render({ focus: "error" });
    create(s, () => { s.phase = "landed"; });
  },
  "c-open"(s, arg) { s.errors = {}; s.cOpen = arg; render({ focus: "heading" }); },
  "sheet-close"(s) { if (s.save === "saving") return; s.sheetOpen = false; s.errors = {}; s.save = "idle"; render(); (document.querySelector("[data-action='start']"))?.focus(); },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]"); if (!el) return;
  const action = el.dataset.action;
  if (action === "sheet-close-scrim") { if (ev.target === el) ACTIONS["sheet-close"](S()); return; }
  ACTIONS[action]?.(S(), el.dataset.arg);
});

/* Radio-group arrow keys (focus moves, Space/Enter selects), tab-list arrow keys, dialog Escape + focus trap. */
document.addEventListener("keydown", (ev) => {
  const radio = ev.target.closest("[role=radio]");
  if (radio && ["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft"].includes(ev.key)) {
    ev.preventDefault();
    const group = [...radio.closest("[role=radiogroup]").querySelectorAll("[role=radio]")];
    const next = group[(group.indexOf(radio) + (ev.key === "ArrowDown" || ev.key === "ArrowRight" ? 1 : -1) + group.length) % group.length];
    // Move focus only: choosing can auto-advance (approach B), so Space/Enter commits.
    group.forEach((r) => (r.tabIndex = r === next ? 0 : -1));
    next.focus();
    return;
  }
  const tab = ev.target.closest("[role=tab]");
  if (tab && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
    const tabs = [...document.querySelectorAll("[role=tab]")];
    const next = tabs[(tabs.indexOf(tab) + (ev.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
    switchTo(next.dataset.approach); next.focus();
    return;
  }
  const dialog = document.querySelector("[role=dialog]");
  if (dialog) {
    if (ev.key === "Escape") { ev.preventDefault(); ACTIONS["sheet-close"](S()); return; }
    if (ev.key === "Tab") {
      const f = [...dialog.querySelectorAll("button:not([disabled]), input:not([tabindex='-1']), select, [tabindex='0']")];
      const first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  }
});

/* Drag and drop onto lease drop zones. */
document.addEventListener("dragover", (ev) => { const d = ev.target.closest("[data-drop]"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (ev) => { ev.target.closest("[data-drop]")?.classList.remove("over"); });
document.addEventListener("drop", (ev) => { const d = ev.target.closest("[data-drop]"); if (!d) return; ev.preventDefault(); const f = ev.dataTransfer.files[0]; if (f) handleFile(Number(d.dataset.drop), f); });

/* ---------- Review-bar controls ---------- */
function switchTo(a) { current = a; history.replaceState(null, "", "#" + a); render(); }
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => switchTo(t.dataset.approach)));
document.getElementById("fill").addEventListener("click", () => {

  if (current === "c") { s.sheetOpen = false; s.phase = "page"; }
  else if (s.phase === "start") s.phase = "flow";
  if (current === "d") s.dSecMax = D_SECTIONS.length - 1;
  render({ focus: "heading" }); announce("Sample data filled.");
});

document.getElementById("fail").addEventListener("change", (ev) => { failSave = ev.target.checked; });

current = ["a", "b", "c", "d"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "a";
render();
