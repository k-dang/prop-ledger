<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property onboarding — four approaches</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #252525;
    --muted: #f7f7f7;
    --muted-fg: #6e6e6e;
    --border: #ededed;
    --input: #d6d6d6;
    --ink: #262626;
    --ink-fg: #fafafa;
    --sidebar: #fafafa;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --ready: #065f46; --ready-bg: #ecfdf5; --ready-border: #a7f3d0;
    --review: #92400e; --review-bg: #fffbeb; --review-border: #fde68a;
    --blocked: #991b1b; --blocked-bg: #fef2f2; --blocked-border: #fecaca;
    --r-md: 0.5rem; --r-lg: 0.625rem; --r-xl: 0.875rem;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 400 0.875rem/1.5 var(--font); color: var(--fg); background: var(--muted); font-feature-settings: "cv11"; }
  h1, h2, h3, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 1rem; height: 1rem; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Review bar (prototype controls, not product UI) ---------- */
  .review-bar { position: sticky; top: 0; z-index: 30; background: #1f1f1f; color: #f2f2f2; border-bottom: 1px solid #000; }
  .review-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; padding: 0.625rem 1rem; max-width: 92rem; margin: 0 auto; }
  .review-title { font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.01em; }
  .review-title span { color: #a3a3a3; font-weight: 400; }
  .tabs { display: flex; gap: 0.25rem; background: #2d2d2d; padding: 0.1875rem; border-radius: var(--r-lg); }
  .tab { border: 0; background: transparent; color: #cfcfcf; padding: 0.375rem 0.75rem; border-radius: var(--r-md); cursor: pointer; font-size: 0.8125rem; min-height: 2rem; }
  .tab[aria-selected="true"] { background: #fafafa; color: #1f1f1f; font-weight: 500; }
  .tab:focus-visible { outline-color: #a5b4fc; }
  .review-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; margin-left: auto; font-size: 0.8125rem; }
  .review-tools button { border: 1px solid #4a4a4a; background: transparent; color: #f2f2f2; border-radius: var(--r-md); padding: 0.3125rem 0.625rem; cursor: pointer; min-height: 2rem; }
  .review-tools button:hover { background: #2d2d2d; }
  .review-tools label { display: inline-flex; align-items: center; gap: 0.375rem; cursor: pointer; color: #cfcfcf; }
  .review-tools input { accent-color: #a5b4fc; width: 1rem; height: 1rem; }
  .hypothesis { max-width: 92rem; margin: 0 auto; padding: 0 1rem 0.625rem; color: #bdbdbd; font-size: 0.8125rem; }
  .hypothesis strong { color: #fafafa; font-weight: 500; }

  /* ---------- App chrome ---------- */
  .frame { max-width: 92rem; margin: 1rem auto; padding: 0 1rem 2rem; }
  .app { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); min-height: 46rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; }
  .side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 1.25rem; }
  .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.875rem; padding: 0 0.375rem; }
  .brand-mark { width: 1.5rem; height: 1.5rem; border-radius: 0.375rem; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .brand-mark svg { width: 0.875rem; height: 0.875rem; }
  .nav { display: grid; gap: 0.125rem; }
  .nav span { display: flex; align-items: center; gap: 0.5rem; padding: 0.4375rem 0.5rem; border-radius: var(--r-md); color: var(--muted-fg); }
  .nav span.on { background: #efefef; color: var(--fg); font-weight: 500; }
  .main { min-width: 0; padding: 1.5rem 1.75rem 2.5rem; }

  /* ---------- Primitives ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; min-height: 2.25rem; padding: 0 0.875rem; border-radius: var(--r-lg); border: 1px solid transparent; cursor: pointer; font-weight: 500; white-space: nowrap; background: var(--ink); color: var(--ink-fg); }
  .btn:hover { background: #3a3a3a; }
  .btn.outline { background: var(--bg); color: var(--fg); border-color: var(--input); }
  .btn.outline:hover { background: var(--muted); }
  .btn.ghost { background: transparent; color: var(--fg); }
  .btn.ghost:hover { background: var(--muted); }
  .btn.link { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); font-weight: 500; }
  .btn.link:hover { text-decoration: underline; background: none; }
  .btn.danger-ghost { background: transparent; color: var(--muted-fg); padding: 0 0.5rem; }
  .btn.danger-ghost:hover { color: var(--blocked); background: var(--blocked-bg); }
  .btn[aria-disabled="true"], .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn.lg { min-height: 2.75rem; padding: 0 1.25rem; font-size: 0.9375rem; }
  .spinner { width: 0.875rem; height: 0.875rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .field { display: grid; gap: 0.375rem; min-width: 0; align-content: start; }
  .field label, .label { font-weight: 500; font-size: 0.8125rem; }
  .opt { color: var(--muted-fg); font-weight: 400; }
  .field input, .field select { width: 100%; min-height: 2.25rem; padding: 0.375rem 0.625rem; border: 1px solid var(--input); border-radius: var(--r-lg); background: var(--bg); }
  .field input:focus-visible, .field select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(79 70 229 / 0.18); }
  .field input[aria-invalid="true"] { border-color: var(--blocked); }
  .field input[aria-invalid="true"]:focus-visible { box-shadow: 0 0 0 3px rgb(153 27 27 / 0.15); }
  .money { position: relative; }
  .money::before { content: "$"; position: absolute; left: 0.625rem; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none; }
  .money input { padding-left: 1.375rem; }
  .pct { position: relative; }
  .pct::after { content: "%"; position: absolute; right: 0.625rem; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none; }
  .pct input { padding-right: 1.625rem; text-align: right; }
  .hint { color: var(--muted-fg); font-size: 0.75rem; }
  .err { display: flex; align-items: center; gap: 0.25rem; color: var(--blocked); font-size: 0.75rem; }
  .err svg { width: 0.875rem; height: 0.875rem; }
  .grid2 { display: grid; gap: 0.875rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-addr { display: grid; gap: 0.875rem; grid-template-columns: minmax(0, 1fr) 5.5rem 9.5rem; }
  .stack { display: grid; gap: 0.875rem; }

  .badge { display: inline-flex; align-items: center; gap: 0.25rem; height: 1.375rem; padding: 0 0.5rem; border-radius: 1rem; border: 1px solid; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
  .badge svg { width: 0.75rem; height: 0.75rem; }
  .ready { color: var(--ready); background: var(--ready-bg); border-color: var(--ready-border); }
  .review { color: var(--review); background: var(--review-bg); border-color: var(--review-border); }
  .blocked { color: var(--blocked); background: var(--blocked-bg); border-color: var(--blocked-border); }
  .neutral { color: var(--muted-fg); background: var(--muted); border-color: var(--border); }

  .card { border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--bg); }
  .callout { display: flex; gap: 0.625rem; align-items: flex-start; padding: 0.75rem 0.875rem; border-radius: var(--r-lg); border: 1px solid; font-size: 0.8125rem; }
  .callout svg { margin-top: 0.125rem; }
  .callout.info { background: var(--muted); border-color: var(--border); color: var(--fg); }
  .boundary { border-style: dashed; background: var(--accent-soft); border-color: #c7d2fe; color: #3730a3; }

  /* Choice cards (radio groups) */
  .choices { display: grid; gap: 0.5rem; }
  .choices.cols { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
  .choice { display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; text-align: left; padding: 0.75rem 0.875rem; border: 1px solid var(--input); border-radius: var(--r-lg); background: var(--bg); cursor: pointer; }
  .choice:hover { background: var(--muted); }
  .choice[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .choice .dot { width: 1rem; height: 1rem; margin-top: 0.125rem; border-radius: 50%; border: 1px solid #a3a3a3; flex-shrink: 0; display: grid; place-items: center; background: #fff; }
  .choice[aria-checked="true"] .dot { border-color: var(--accent); }
  .choice[aria-checked="true"] .dot::after { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--accent); }
  .choice strong { display: block; font-weight: 500; }
  .choice small { display: block; color: var(--muted-fg); font-size: 0.75rem; margin-top: 0.125rem; }
  .choice-group-err { margin-top: 0.375rem; }

  .seg { display: inline-flex; padding: 0.1875rem; gap: 0.1875rem; border-radius: var(--r-lg); background: var(--muted); border: 1px solid var(--border); }
  .seg button { border: 0; background: transparent; border-radius: var(--r-md); padding: 0.3125rem 0.75rem; cursor: pointer; min-height: 2rem; color: var(--muted-fg); }
  .seg button[aria-checked="true"] { background: var(--bg); color: var(--fg); font-weight: 500; box-shadow: 0 0 0 1px var(--border); }

  /* Share meter */
  .meter { display: grid; gap: 0.375rem; padding: 0.75rem 0.875rem; border-radius: var(--r-lg); background: var(--muted); }
  .meter-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8125rem; }
  .meter-track { height: 0.375rem; border-radius: 1rem; background: #e5e5e5; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 1rem; transition: width 0.2s; }
  .meter-fill.over { background: var(--blocked); }
  .meter-fill.full { background: var(--ready); }

  /* Repeated rows (owners, units) */
  .rows { display: grid; gap: 0.5rem; }
  .row { display: grid; gap: 0.625rem; align-items: start; }
  .row.owner { grid-template-columns: minmax(0, 1fr) 6.5rem 2.25rem; }
  .row.unit { grid-template-columns: minmax(0, 1fr) 11rem 2.25rem; }
  .row .btn.danger-ghost { margin-top: 1.5rem; min-height: 2.25rem; width: 2.25rem; padding: 0; }
  .row.first-hidden-labels .field label { }

  /* Upload */
  .drop { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.875rem; border: 1px dashed #c4c4c4; border-radius: var(--r-lg); background: var(--bg); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop.err-state { border-color: var(--blocked-border); background: var(--blocked-bg); }
  .drop .file-ico { width: 2rem; height: 2rem; border-radius: var(--r-md); background: var(--muted); display: grid; place-items: center; color: var(--muted-fg); flex-shrink: 0; }
  .drop.done .file-ico { background: var(--ready-bg); color: var(--ready); }
  .drop .meta { min-width: 0; flex: 1; }
  .drop .meta strong { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop .meta span { display: block; color: var(--muted-fg); font-size: 0.75rem; }
  .progress { height: 0.25rem; background: #e5e5e5; border-radius: 1rem; overflow: hidden; margin-top: 0.375rem; }
  .progress i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 1rem; animation: indeterminate 1s ease-in-out infinite; }
  @keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  .page-head { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; }
  .page-head h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .page-head p { color: var(--muted-fg); margin-top: 0.25rem; }
  .meta-line { display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; color: var(--muted-fg); margin-top: 0.375rem; }
  .meta-line span { display: inline-flex; align-items: center; gap: 0.3125rem; }
  .meta-line svg { width: 0.875rem; height: 0.875rem; }

  .empty { display: grid; place-items: center; text-align: center; gap: 0.75rem; padding: 4rem 1.5rem; border: 1px dashed #d4d4d4; border-radius: var(--r-xl); background: var(--bg); }
  .empty .ico { width: 2.75rem; height: 2.75rem; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .empty .ico svg { width: 1.25rem; height: 1.25rem; }
  .empty h2 { font-size: 1rem; font-weight: 600; }
  .empty p { color: var(--muted-fg); max-width: 26rem; }
  .preview-row { display: flex; align-items: center; gap: 0.625rem; padding: 0.75rem 1rem; color: var(--muted-fg); }
  .preview-row + .preview-row { border-top: 1px solid var(--border); }
  .preview-row strong { color: var(--fg); font-weight: 500; }

  /* ---------- Approach A: wizard ---------- */
  .wiz { display: grid; grid-template-columns: 13rem minmax(0, 40rem); gap: 2rem; align-items: start; }
  .rail { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.125rem; position: sticky; top: 7rem; }
  .rail li { display: flex; }
  .rail .step { display: flex; align-items: center; gap: 0.625rem; width: 100%; padding: 0.5rem 0.5rem; border-radius: var(--r-md); background: none; border: 0; text-align: left; color: var(--muted-fg); }
  .rail button.step { cursor: pointer; }
  .rail button.step:hover { background: var(--muted); }
  .rail .bullet { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--input); display: grid; place-items: center; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; background: var(--bg); }
  .rail .done .bullet { background: var(--ready-bg); color: var(--ready); border-color: var(--ready-border); }
  .rail .done .bullet svg { width: 0.75rem; height: 0.75rem; }
  .rail .current { color: var(--fg); font-weight: 500; background: var(--muted); }
  .rail .current .bullet { background: var(--ink); color: #fff; border-color: var(--ink); }
  .wiz-mobile { display: none; }
  .step-card { padding: 1.5rem; }
  .step-card h2 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
  .step-card > p.lede { color: var(--muted-fg); margin-top: 0.25rem; margin-bottom: 1.25rem; }
  .step-foot { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .unit-card { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1rem; display: grid; gap: 0.875rem; }
  .unit-card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .unit-card-head h3 { font-size: 0.9375rem; font-weight: 600; }
  .review-sec { padding: 0.875rem 0; border-top: 1px solid var(--border); }
  .review-sec:first-of-type { border-top: 0; padding-top: 0; }
  .review-sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem; }
  .review-sec-head h3 { font-size: 0.8125rem; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; }
  .review-sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.25rem; }
  .review-sec li { display: flex; justify-content: space-between; gap: 1rem; }
  .review-sec li span:last-child { color: var(--muted-fg); text-align: right; }

  /* ---------- Approach B: interview ---------- */
  .iv { display: grid; grid-template-columns: minmax(0, 36rem) 17rem; gap: 3rem; justify-content: center; align-items: start; padding-top: 0.5rem; }
  .iv-top { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
  .iv-progress { flex: 1; height: 0.25rem; background: #ebebeb; border-radius: 1rem; overflow: hidden; }
  .iv-progress i { display: block; height: 100%; background: var(--accent); border-radius: 1rem; transition: width 0.3s; }
  .iv-count { color: var(--muted-fg); font-size: 0.75rem; }
  .iv h2 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
  .iv .why { color: var(--muted-fg); margin-top: 0.5rem; margin-bottom: 1.5rem; max-width: 32rem; }
  .iv-actions { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.75rem; flex-wrap: wrap; }
  .iv .choice { padding: 0.875rem 1rem; }
  .receipt { margin-top: 4.25rem; padding: 1rem; background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--r-xl); }
  .receipt h3 { font-size: 0.75rem; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
  .receipt dl { margin: 0; display: grid; gap: 0.625rem; }
  .receipt dt { font-size: 0.75rem; color: var(--muted-fg); }
  .receipt dd { margin: 0; font-weight: 500; }
  .receipt .pending { color: #a3a3a3; font-weight: 400; }
  .sentences { display: grid; gap: 0.625rem; margin: 0; padding: 0; list-style: none; }
  .sentences li { display: flex; gap: 0.625rem; align-items: flex-start; padding: 0.75rem 0.875rem; border: 1px solid var(--border); border-radius: var(--r-lg); }
  .sentences li svg { margin-top: 0.1875rem; color: var(--ready); }
  .sentences li.warn svg { color: var(--review); }
  .sentences li > div { flex: 1; }
  .sentences .btn.link { font-size: 0.8125rem; }

  /* ---------- Approach D: recommended hybrid ---------- */
  .rail.d .step { align-items: flex-start; }
  .rail .step-text { display: grid; gap: 0.125rem; padding-top: 0.125rem; min-width: 0; }
  .rail .step-sum { font-size: 0.75rem; line-height: 1.4; color: var(--muted-fg); font-weight: 400; overflow-wrap: anywhere; }
  .rail .step-sum b { color: var(--fg); font-weight: 500; }
  .step-card.q h2 { font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.015em; }
  .eyebrow { color: var(--muted-fg); font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.25rem; }
  .foot-right { display: flex; align-items: center; gap: 0.5rem; }

  /* ---------- Approach C: in-place checklist ---------- */
  .setup { overflow: hidden; }
  .setup-head { padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .setup-head h2 { font-size: 1rem; font-weight: 600; }
  .setup-head p { color: var(--muted-fg); font-size: 0.8125rem; }
  .setup-progress { width: 10rem; height: 0.375rem; border-radius: 1rem; background: #ebebeb; overflow: hidden; }
  .setup-progress i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
  .task + .task { border-top: 1px solid var(--border); }
  .task-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.25rem; width: 100%; }
  .task-head .t-ico { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--input); color: var(--muted-fg); font-size: 0.75rem; font-weight: 600; }
  .task.done .t-ico { background: var(--ready-bg); color: var(--ready); border-color: var(--ready-border); }
  .task.done .t-ico svg { width: 0.75rem; height: 0.75rem; }
  .task.open .t-ico { background: var(--ink); color: #fff; border-color: var(--ink); }
  .task-head .t-text { flex: 1; min-width: 0; }
  .task-head strong { display: block; font-weight: 500; }
  .task-head span.t-sub { display: block; color: var(--muted-fg); font-size: 0.8125rem; }
  .task-body { padding: 0 1.25rem 1.25rem 3.5rem; display: grid; gap: 1rem; }
  .lease-row { display: grid; gap: 0.75rem; padding: 0.875rem; border: 1px solid var(--border); border-radius: var(--r-lg); }
  .lease-row-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .lease-grid { display: grid; gap: 0.75rem; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) 8rem; }
  .muted-section { opacity: 1; }
  .muted-section .preview-row { color: #8a8a8a; }

  /* Dialog (sheet) */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 40; display: flex; justify-content: flex-end; animation: fade 0.15s ease-out; }
  .sheet { width: min(32rem, 100%); height: 100%; background: var(--bg); display: flex; flex-direction: column; box-shadow: -8px 0 24px rgb(0 0 0 / 0.08); animation: slide 0.2s ease-out; }
  .sheet-head { padding: 1.25rem 1.25rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 1rem; }
  .sheet-head h2 { font-size: 1rem; font-weight: 600; }
  .sheet-head p { color: var(--muted-fg); font-size: 0.8125rem; margin-top: 0.25rem; }
  .sheet-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
  .sheet-foot { padding: 1rem 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slide { from { transform: translateX(2rem); opacity: 0; } }

  .fade-in { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.375rem); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .progress i { animation: none; width: 100%; opacity: 0.5; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .iv { grid-template-columns: minmax(0, 36rem); }
    .receipt { margin-top: 0; }
    .lease-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 1.25rem 1rem 2rem; }
    .wiz { grid-template-columns: 1fr; gap: 1rem; }
    .rail { display: none; }
    .wiz-mobile { display: grid; gap: 0.5rem; margin-bottom: 0.5rem; }
    .task-body { padding-left: 1.25rem; }
  }
  @media (max-width: 560px) {
    .review-bar { position: static; }
    .frame { padding: 0 0.5rem 1.5rem; margin-top: 0.5rem; }
    .grid2, .grid-addr, .lease-grid { grid-template-columns: 1fr; }
    .row.owner { grid-template-columns: minmax(0, 1fr) 5.5rem 2.25rem; }
    .row.unit { grid-template-columns: minmax(0, 1fr) 2.25rem; }
    .row.unit .field:nth-child(2) { grid-column: 1 / 2; grid-row: 2; }
    .step-card { padding: 1.125rem; }
    .step-foot { flex-direction: column-reverse; align-items: stretch; }
    .step-foot .btn { width: 100%; }
    .foot-right { flex-direction: column-reverse; align-items: stretch; }
    .iv h2 { font-size: 1.25rem; }
    .review-tools { margin-left: 0; }
    .tab { padding: 0.375rem 0.5rem; }
  }
</style>
</head>
<body>
<div class="review-bar">
  <div class="review-inner">
    <p class="review-title">Property onboarding <span>· prototype</span></p>
    <div class="tabs" role="tablist" aria-label="Onboarding approach">
      <button class="tab" role="tab" id="tab-a" data-approach="a" aria-controls="stage">A · Guided wizard</button>
      <button class="tab" role="tab" id="tab-b" data-approach="b" aria-controls="stage">B · Interview</button>
      <button class="tab" role="tab" id="tab-c" data-approach="c" aria-controls="stage">C · In-place checklist</button>
      <button class="tab" role="tab" id="tab-d" data-approach="d" aria-controls="stage">D · Recommended</button>
    </div>
    <div class="review-tools">
      <button type="button" id="fill">Fill sample data</button>
      <button type="button" id="reset">Restart this approach</button>
      <label><input type="checkbox" id="fail"> Simulate save failure</label>
    </div>
  </div>
  <p class="hypothesis" id="hypothesis"></p>
</div>

<div class="frame">
  <div class="app">
    <aside class="side" aria-label="App navigation (static)">
      <div class="brand"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg></span>Rental Workspace</div>
      <nav class="nav" aria-label="Sections">
        <span class="on">Dashboard</span><span>Transactions</span><span>Documents</span><span>Year-end</span><span>Settings</span>
      </nav>
    </aside>
    <main class="main" id="stage" role="tabpanel" tabindex="-1"></main>
  </div>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="portal"></div>

<script>
/* ============================================================
   Shared model
   ============================================================ */
const TODAY = "2026-10-04";
const MAX_BYTES = 20 * 1024 * 1024;
const PROVINCES = ["AB","BC","MB","NB","NL","NS","NT","NU","ON","PE","QC","SK","YT"];
const UNIT_TYPES = ["House","Apartment","Basement apartment","Room","Other"];
const FREQS = [["monthly","Monthly"],["biweekly","Every 2 weeks"],["weekly","Weekly"]];
const LAYOUTS = {
  house:   { label: "Whole house", sub: "One unit, rented as a whole", units: [["Whole house","House"]] },
  basement:{ label: "House with a basement unit", sub: "Main floor and basement", units: [["Main floor","Apartment"],["Basement","Basement apartment"]] },
  duplex:  { label: "Duplex", sub: "Upper and lower units", units: [["Upper","Apartment"],["Lower","Apartment"]] },
  triplex: { label: "Triplex", sub: "Three separate units", units: [["Unit 1","Apartment"],["Unit 2","Apartment"],["Unit 3","Apartment"]] },
  custom:  { label: "Something else", sub: "Name the units yourself", units: [["Unit 1","Apartment"]] },
};
const HYPOTHESES = {
  a: "<strong>Guided wizard.</strong> A dedicated page walks through property → ownership → units → tenants &amp; leases → review. Nothing is created until the user confirms, so the property arrives in the workspace already setup-complete.",
  b: "<strong>Interview.</strong> One plain-language question per screen. Choices (“Just me”, “Duplex”) generate the records, so most landlords type only names, dates and rent. A running summary shows what’s been captured.",
  d: "<strong>Recommended: A’s structure, B’s questions.</strong> Three short screens plus one per unit, then one review and one save. Each screen asks a plain-language question and only reveals what the answer needs. The step rail doubles as the running summary. “Save and finish later” lands on a checklist that reopens this same flow.",
  c: "<strong>In-place checklist.</strong> Keep today’s short Add property sheet, then land on the property with a single “Finish setting up” checklist at the top. One section opens at a time, inline — no hunting through accordions or opening sheets.",
};

let uid = 0;
const newId = () => "k" + (++uid);
function freshState() {
  return {
    phase: "start",            // start | flow | landed  (C: start | page)
    step: 0,
    property: { line1: "", line2: "", city: "", province: "ON", postal: "", acquired: "", name: "" },
    nameTouched: false,
    ownerMode: null,           // solo | partner | multi
    owners: [],
    layout: null,
    units: [],
    errors: {},
    save: "idle",              // idle | saving | error
    sheetOpen: false,
    cOpen: "units",
    cDone: { units: false, ownership: false, leases: false },
    dSecMax: 0,                // D: furthest rail section reached
  };
}
const states = { a: freshState(), b: freshState(), c: freshState(), d: freshState() };
let current = "a";
let failSave = false;
const S = () => states[current];

const newUnit = (label = "", type = "Apartment") => ({ id: newId(), label, type, rented: null, tenant: "", start: "", rent: "", freq: "monthly", doc: null });
const newOwner = (name = "", share = "") => ({ id: newId(), name, share: String(share) });

function sample(s) {
  Object.assign(s.property, { line1: "100 King Street W", line2: "", city: "Hamilton", province: "ON", postal: "L8P 1A1", acquired: "2021-04-15", name: "King Street Duplex" });
  s.nameTouched = true;
  s.ownerMode = "partner";
  s.owners = [newOwner("Alex Chen", 50), newOwner("Jordan Chen", 50)];
  s.layout = "duplex";
  s.units = [
    Object.assign(newUnit("Upper", "Apartment"), { rented: true, tenant: "Priya Shah", start: "2024-09-01", rent: "2150", doc: { name: "Upper-lease-2024.pdf", size: 412_000, status: "done" } }),
    Object.assign(newUnit("Lower", "Apartment"), { rented: true, tenant: "Marcus Lee", start: "2023-05-01", rent: "1875" }),
  ];
  s.errors = {};
}

/* ---------- path helpers ---------- */
const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
function set(o, p, v) { const ks = p.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { const n = Number(String(v).replace(/[$,\s]/g, "")); return Number.isFinite(n) ? n : NaN; };
const money = (v) => new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 2 }).format(num(v) || 0);
const fmtDate = (d) => { if (!d) return ""; const [y, m, day] = d.split("-").map(Number); return new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric", year: "numeric" }).format(new Date(y, m - 1, day)); };
const fmtSize = (b) => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const freqLabel = (f) => (FREQS.find(([v]) => v === f) || [, ""])[1].toLowerCase();
const totalShare = (s) => s.owners.reduce((t, o) => t + (num(o.share) || 0), 0);
const round2 = (n) => Math.round(n * 100) / 100;
function announce(msg) { const l = document.getElementById("live"); l.textContent = ""; setTimeout(() => (l.textContent = msg), 30); }

/* ---------- validation (one function per record group) ---------- */
function vProperty(s, keys) {
  const e = {}, p = s.property;
  if (!p.line1.trim()) e["property.line1"] = "Enter the street address.";
  if (!p.city.trim()) e["property.city"] = "Enter the municipality.";
  if (!p.postal.trim()) e["property.postal"] = "Enter the postal code.";
  else if (!/^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/.test(p.postal.trim())) e["property.postal"] = "Use a Canadian postal code, like L8P 1A1.";
  else p.postal = p.postal.trim().toUpperCase().replace(/^(...)[ -]?(...)$/, "$1 $2");
  if (!p.acquired) e["property.acquired"] = "Enter the date you took ownership.";
  else if (p.acquired > TODAY) e["property.acquired"] = "The acquisition date can’t be in the future.";
  if (keys && keys.includes("property.name") && !p.name.trim()) e["property.name"] = "Give the property a name.";
  if (!keys) return e;
  return Object.fromEntries(Object.entries(e).filter(([k]) => keys.includes(k)));
}
function vOwnerMode(s) { return s.ownerMode ? {} : { ownerMode: "Choose who owns the property." }; }
function vOwners(s) {
  const e = vOwnerMode(s);
  s.owners.forEach((o, i) => {
    if (!o.name.trim()) e[`owners.${i}.name`] = "Enter the owner’s name.";
    const n = num(o.share);
    if (!(n > 0 && n <= 100)) e[`owners.${i}.share`] = "Between 0 and 100.";
  });
  const t = round2(totalShare(s));
  if (s.owners.length && Math.abs(t - 100) > 0.001 && !Object.keys(e).some((k) => k.endsWith(".share"))) e.shares = `Shares must add up to 100%. They add up to ${t}%.`;
  return e;
}
function vLayout(s) { return s.layout ? {} : { layout: "Choose how the property is rented out." }; }
function vUnits(s) {
  const e = vLayout(s);
  if (s.layout && s.units.length === 0) e.units = "Add at least one unit.";
  const seen = new Set();
  s.units.forEach((u, i) => {
    const l = u.label.trim().toLowerCase();
    if (!l) e[`units.${i}.label`] = "Name this unit.";
    else if (seen.has(l)) e[`units.${i}.label`] = "Each unit needs a different name.";
    seen.add(l);
  });
  return e;
}
function vRented(s, i) { return s.units[i].rented === null ? { [`units.${i}.rented`]: "Choose rented or vacant." } : {}; }
function vLease(s, i) {
  const u = s.units[i], e = {};
  if (u.rented !== true) return e;
  if (!u.tenant.trim()) e[`units.${i}.tenant`] = "Enter the tenant’s name.";
  if (!u.start) e[`units.${i}.start`] = "Enter the lease start date.";
  if (!(num(u.rent) > 0)) e[`units.${i}.rent`] = "Enter the rent amount.";
  return e;
}
function vDoc(s, i) { return s.units[i].doc?.status === "uploading" ? { [`units.${i}.doc`]: "Wait for the upload to finish." } : {}; }
function vLeases(s) { return s.units.reduce((e, _, i) => ({ ...e, ...vRented(s, i), ...vLease(s, i), ...vDoc(s, i) }), {}); }

/* ============================================================
   Shared rendering pieces
   ============================================================ */
const ICONS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  upload: '<path d="M12 15V3M7 8l5-5 5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="M5 12h14M13 5l7 7-7 7"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V21H3z"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  dot: '<circle cx="12" cy="12" r="4"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const fid = (path) => "f-" + current + "-" + path.replace(/\./g, "-");

function errText(s, path) { const m = s.errors[path]; return m ? `<p class="err" id="${fid(path)}-err">${icon("alert")}${esc(m)}</p>` : ""; }

function field(s, path, label, o = {}) {
  const { type = "text", hint = "", placeholder = "", autocomplete = "", inputmode = "", optional = false, wrap = "", max = "", srLabel = false } = o;
  const id = fid(path), err = s.errors[path];
  const describedby = err ? `${id}-err` : hint ? `${id}-hint` : "";
  const input = `<input id="${id}" type="${type}" data-bind="${path}" value="${esc(get(s, path))}"${placeholder ? ` placeholder="${esc(placeholder)}"` : ""}${autocomplete ? ` autocomplete="${autocomplete}"` : ""}${inputmode ? ` inputmode="${inputmode}"` : ""}${max ? ` max="${max}"` : ""}${err ? ' aria-invalid="true"' : ""}${describedby ? ` aria-describedby="${describedby}"` : ""}>`;
  return `<div class="field">
    <label for="${id}"${srLabel ? ' class="sr-only"' : ""}>${label}${optional ? ' <span class="opt">(optional)</span>' : ""}</label>
    ${wrap ? `<div class="${wrap}">${input}</div>` : input}
    ${err ? errText(s, path) : hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ""}
  </div>`;
}
function selectField(s, path, label, options, o = {}) {
  const id = fid(path), v = get(s, path);
  return `<div class="field"><label for="${id}"${o.srLabel ? ' class="sr-only"' : ""}>${label}</label>
    <select id="${id}" data-bind="${path}">${options.map((opt) => { const [val, text] = Array.isArray(opt) ? opt : [opt, opt]; return `<option value="${esc(val)}"${val === v ? " selected" : ""}>${esc(text)}</option>`; }).join("")}</select></div>`;
}

/* Radio group rendered as choice cards; arrow keys move between options. */
function choiceGroup(s, name, label, options, value, o = {}) {
  const err = s.errors[name];
  return `<div role="radiogroup" aria-label="${esc(label)}" class="choices${o.cols ? " cols" : ""}" data-group="${name}"${err ? ` aria-describedby="${fid(name)}-err" aria-invalid="true"` : ""}>
    ${options.map(([val, title, sub], idx) => {
      const checked = value === val;
      const tabbable = checked || (value == null && idx === 0);
      return `<button type="button" class="choice" role="radio" aria-checked="${checked}" tabindex="${tabbable ? 0 : -1}" data-action="${o.action}" data-arg="${val}">
        <span class="dot" aria-hidden="true"></span><span><strong>${title}</strong>${sub ? `<small>${sub}</small>` : ""}</span></button>`;
    }).join("")}
  </div>${err ? `<div class="choice-group-err">${errText(s, name)}</div>` : ""}`;
}

function addressFields(s) {
  return `<div class="stack">
    ${field(s, "property.line1", "Street address", { autocomplete: "address-line1", placeholder: "100 King Street W" })}
    ${field(s, "property.line2", "Apartment, suite, etc.", { optional: true, autocomplete: "address-line2" })}
    <div class="grid-addr">
      ${field(s, "property.city", "Municipality", { autocomplete: "address-level2" })}
      ${selectField(s, "property.province", "Province", PROVINCES)}
      ${field(s, "property.postal", "Postal code", { autocomplete: "postal-code", placeholder: "L8P 1A1" })}
    </div>
  </div>`;
}

function shareMeter(s) {
  const t = round2(totalShare(s));
  const cls = t > 100.001 ? "over" : Math.abs(t - 100) < 0.001 ? "full" : "";
  const status = cls === "full" ? `<span class="badge ready">${icon("check")}Adds up to 100%</span>`
    : cls === "over" ? `<span class="badge blocked">${icon("alert")}${round2(t - 100)}% over</span>`
    : `<span class="badge review">${round2(100 - t)}% unassigned</span>`;
  return `<div class="meter" id="share-meter"><div class="meter-row"><span>Total ownership <strong class="num">${t}%</strong></span>${status}</div>
    <div class="meter-track" aria-hidden="true"><div class="meter-fill ${cls}" style="width:${Math.min(t, 100)}%"></div></div></div>
    ${s.errors.shares ? errText(s, "shares") : ""}`;
}

/* Owners editor. Solo hides shares; partner fixes 50/50; multi edits shares. */
function ownersEditor(s) {
  if (s.ownerMode === "solo") {
    return field(s, "owners.0.name", "Your name", { autocomplete: "name", hint: "As it appears on your T776. You own 100%." });
  }
  if (s.ownerMode === "partner") {
    return `<div class="stack"><div class="grid2">${s.owners.map((_, i) => field(s, `owners.${i}.name`, `Owner ${i + 1}`, { autocomplete: i === 0 ? "name" : "off" })).join("")}</div>
      <p class="hint">Each owns 50%. Need different shares? <button type="button" class="btn link" data-action="owner-mode" data-arg="multi">Enter shares instead</button></p></div>`;
  }
  return `<div class="stack">
    <div class="rows">
      ${s.owners.map((o, i) => `<div class="row owner">
        ${field(s, `owners.${i}.name`, `Owner ${i + 1} name`, { autocomplete: i === 0 ? "name" : "off" })}
        ${field(s, `owners.${i}.share`, "Share", { inputmode: "decimal", wrap: "pct" })}
        ${s.owners.length > 2 ? `<button type="button" class="btn danger-ghost" data-action="remove-owner" data-arg="${i}" aria-label="Remove owner ${i + 1}">${icon("trash")}</button>` : "<span></span>"}
      </div>`).join("")}
    </div>
    <div><button type="button" class="btn outline" data-action="add-owner">${icon("plus")}Add owner</button></div>${shareMeter(s)}
  </div>`;
}

function unitsEditor(s) {
  return `<div class="stack"><div class="rows">
    ${s.units.map((u, i) => `<div class="row unit">
      ${field(s, `units.${i}.label`, "Unit name")}
      ${selectField(s, `units.${i}.type`, "Type", UNIT_TYPES)}
      ${s.units.length > 1 ? `<button type="button" class="btn danger-ghost" data-action="remove-unit" data-arg="${i}" aria-label="Remove ${esc(u.label || "unit " + (i + 1))}">${icon("trash")}</button>` : "<span></span>"}
    </div>`).join("")}
  </div>
  ${s.errors.units ? errText(s, "units") : ""}
  <div><button type="button" class="btn outline" data-action="add-unit">${icon("plus")}Add unit</button></div></div>`;
}

function rentedToggle(s, i) {
  const u = s.units[i], err = s.errors[`units.${i}.rented`];
  return `<div><div class="seg" role="radiogroup" aria-label="Is ${esc(u.label)} rented?" data-group="rented-${i}"${err ? ` aria-describedby="${fid(`units.${i}.rented`)}-err"` : ""}>
    <button type="button" role="radio" aria-checked="${u.rented === true}" tabindex="${u.rented !== false ? 0 : -1}" data-action="rented" data-arg="${i}:yes">Rented</button>
    <button type="button" role="radio" aria-checked="${u.rented === false}" tabindex="${u.rented === false ? 0 : -1}" data-action="rented" data-arg="${i}:no">Vacant</button>
  </div>${err ? errText(s, `units.${i}.rented`) : ""}</div>`;
}

function leaseFields(s, i, compact = false) {
  return `<div class="${compact ? "lease-grid" : "stack"}">
    ${field(s, `units.${i}.tenant`, compact ? "Tenant" : "Tenant name(s)", { autocomplete: "off", hint: compact ? "" : "Everyone named on the lease." })}
    ${field(s, `units.${i}.start`, "Lease start", { type: "date", max: "2099-12-31" })}
    ${compact ? field(s, `units.${i}.rent`, "Rent", { inputmode: "decimal", wrap: "money" })
      : `<div class="grid2">${field(s, `units.${i}.rent`, "Rent", { inputmode: "decimal", wrap: "money" })}${selectField(s, `units.${i}.freq`, "Paid", FREQS)}</div>`}
    ${compact ? selectField(s, `units.${i}.freq`, "Paid", FREQS) : ""}
  </div>`;
}

/* Lease document drop zone: idle → uploading → done | error. Upload is simulated. */
function docDrop(s, i, o = {}) {
  const u = s.units[i], d = u.doc, err = s.errors[`units.${i}.doc`];
  const input = `<input type="file" class="sr-only" id="${fid(`units.${i}.file`)}" data-file="${i}" accept="application/pdf,image/*" tabindex="-1" aria-hidden="true">`;
  if (d && d.status === "uploading") {
    return `<div class="drop" aria-busy="true"><span class="file-ico">${icon("file")}</span><div class="meta"><strong>${esc(d.name)}</strong><span>Uploading… ${fmtSize(d.size)}</span><div class="progress"><i></i></div></div></div>${err ? errText(s, `units.${i}.doc`) : ""}`;
  }
  if (d && d.status === "done") {
    return `<div class="drop done"><span class="file-ico">${icon("check")}</span><div class="meta"><strong>${esc(d.name)}</strong><span>${fmtSize(d.size)} · Linked to ${esc(u.tenant || u.label)}’s lease</span></div>
      <button type="button" class="btn ghost" data-action="remove-doc" data-arg="${i}" aria-label="Remove ${esc(d.name)}">${icon("x")}</button></div>`;
  }
  const failed = d && d.status === "error";
  return `<div class="drop${failed ? " err-state" : ""}" data-drop="${i}">${input}
    <span class="file-ico">${icon(failed ? "alert" : "upload")}</span>
    <div class="meta"><strong>${failed ? esc(d.error) : o.title || "Signed lease"}</strong><span>${failed ? esc(d.name) + " · Choose another file" : "PDF or photo, up to 20 MB. Drop it here or browse."}</span></div>
    <button type="button" class="btn outline" data-action="pick-file" data-arg="${i}">${failed ? "Try again" : "Browse"}</button></div>`;
}

function propertyHeader(s, badge) {
  const p = s.property;
  return `<header class="page-head"><div><h1 tabindex="-1" data-focus>${esc(p.name || p.line1)}</h1>
    <p class="meta-line"><span>${icon("pin")}${esc(p.line1)}${p.line2 ? ", " + esc(p.line2) : ""}, ${esc(p.city)}, ${esc(p.province)} ${esc(p.postal.toUpperCase())}</span><span>${icon("cal")}Acquired ${fmtDate(p.acquired)}</span></p></div>${badge || ""}</header>`;
}

function emptyPortfolio(label) {
  return `<header class="page-head"><div><h1 tabindex="-1" data-focus>Portfolio</h1><p>2026 tax year</p></div></header>
  <div class="empty fade-in"><span class="ico">${icon("home")}</span><h2>Add your first rental property</h2>
    <p>Set up its owners, units and leases once. After that you’ll log rent and expenses, and see what’s left before you file.</p>
    <button type="button" class="btn lg" data-action="start">${icon("plus")}${label}</button></div>`;
}

function saveButton(s, label) {
  if (s.save === "saving") return `<button type="button" class="btn lg" aria-disabled="true" disabled><span class="spinner" aria-hidden="true"></span>Creating property…</button>`;
  return `<button type="button" class="btn lg" data-action="create">${label}${icon("right")}</button>`;
}
function saveError(s) {
  return s.save === "error" ? `<div class="callout blocked" role="alert" style="margin-top:1rem">${icon("alert")}<div><strong>We couldn’t save the property.</strong> Nothing was lost — your answers are still here. Try again in a moment.</div></div>` : "";
}

/* Hand-off: what the user sees right after onboarding. */
function landed(s) {
  const rented = s.units.filter((u) => u.rented);
  const missingDocs = rented.filter((u) => !u.doc || u.doc.status !== "done");
  return `${propertyHeader(s, `<span class="badge ready">${icon("check")}Setup complete</span>`)}
  <div class="card fade-in" style="padding:1.25rem;max-width:44rem">
    <h2 style="font-size:1rem;font-weight:600">${esc(s.property.name)} is ready to track</h2>
    <p style="color:var(--muted-fg);margin-top:.25rem">${plural(s.units.length, "unit")} · ${plural(s.owners.length, "owner")} · ${plural(rented.length, "active lease")}</p>
    <ul class="sentences" style="margin-top:1rem">
      ${missingDocs.length ? `<li class="warn">${icon("dot")}<div><strong>${plural(missingDocs.length, "lease document")} still to upload</strong><br><span style="color:var(--muted-fg)">${missingDocs.map((u) => esc(u.tenant) + " (" + esc(u.label) + ")").join(", ")}. Optional for filing, but useful if CRA asks.</span></div><span class="badge review">Recommended</span></li>` : ""}
      <li>${icon("check")}<div><strong>Next: record rent as it comes in</strong><br><span style="color:var(--muted-fg)">Rent payments will default to the right tenant and unit.</span></div></li>
    </ul>
    <div class="callout boundary" style="margin-top:1rem">${icon("info")}<div>Prototype boundary: in the product this lands on the existing property workspace (rent, expenses, filing readiness).</div></div>
    <div style="margin-top:1rem"><button type="button" class="btn outline" data-action="restart">Start over</button></div>
  </div>`;
}

/* ============================================================
   Approach A — guided wizard
   ============================================================ */
const A_STEPS = [
  { title: "Property", lede: "Where it is and when you took ownership.", body: (s) => `<div class="stack">${addressFields(s)}
      <div class="grid2">${field(s, "property.acquired", "Acquisition date", { type: "date", max: TODAY, hint: "Your closing date." })}
      ${field(s, "property.name", "Property name", { hint: "Shown across your workspace." })}</div></div>`,
    validate: (s) => vProperty(s, ["property.line1","property.city","property.postal","property.acquired","property.name"]) },
  { title: "Ownership", lede: "Shares apply from the acquisition date and decide how income and expenses are split.", body: (s) => `<div class="stack">
      ${choiceGroup(s, "ownerMode", "Who owns this property?", [["solo", "Just me", "You own 100%"], ["partner", "Me and one other person, equally", "50% each"], ["multi", "Several owners or unequal shares", "Enter each share"]], s.ownerMode, { action: "owner-mode" })}
      ${s.ownerMode ? `<div class="fade-in">${ownersEditor(s)}</div>` : ""}
      ${s.ownerMode ? `<p class="hint">If ownership changed after ${fmtDate(s.property.acquired) || "purchase"}, you can add that history later from the property page.</p>` : ""}</div>`,
    validate: vOwners },
  { title: "Units", lede: "Each rentable space gets its own unit so rent lands in the right place.", body: (s) => `<div class="stack">
      ${choiceGroup(s, "layout", "How is it rented out?", Object.entries(LAYOUTS).map(([k, v]) => [k, v.label, v.sub]), s.layout, { action: "layout", cols: true })}
      ${s.layout ? `<div class="fade-in"><p class="label" style="margin-bottom:.5rem">Units</p>${unitsEditor(s)}</div>` : ""}</div>`,
    validate: vUnits },
  { title: "Tenants & leases", lede: "Who’s renting each unit today. The signed lease is optional now and can be added later.", body: (s) => `<div class="stack">
      ${s.units.map((u, i) => `<section class="unit-card" aria-labelledby="${fid("unit-" + i)}">
        <div class="unit-card-head"><h3 id="${fid("unit-" + i)}">${esc(u.label)} <span class="opt" style="font-weight:400">· ${esc(u.type)}</span></h3>${rentedToggle(s, i)}</div>
        ${u.rented === true ? `<div class="stack fade-in">${leaseFields(s, i)}<div><p class="label" style="margin-bottom:.375rem">Signed lease <span class="opt">(optional)</span></p>${docDrop(s, i)}</div></div>` : ""}
        ${u.rented === false ? `<p class="hint">No lease needed. Add a tenant whenever this unit is rented.</p>` : ""}
      </section>`).join("")}</div>`,
    validate: vLeases },
  { title: "Review", lede: "Check everything once. Nothing is saved until you create the property.", body: (s) => reviewA(s), validate: () => ({}) },
];

function reviewA(s) {
  const p = s.property;
  const sec = (title, step, items) => `<section class="review-sec"><div class="review-sec-head"><h3>${title}</h3><button type="button" class="btn link" data-action="goto" data-arg="${step}">Edit<span class="sr-only"> ${title}</span></button></div><ul>${items.join("")}</ul></section>`;
  const li = (a, b) => `<li><span>${a}</span><span>${b}</span></li>`;
  return `<div>
    ${sec("Property", 0, [li(esc(p.name), `${esc(p.line1)}, ${esc(p.city)}, ${esc(p.province)}`), li("Acquired", fmtDate(p.acquired))])}
    ${sec("Ownership", 1, s.owners.map((o) => li(esc(o.name), `<span class="num">${round2(num(o.share))}%</span>`)))}
    ${sec("Units & leases", 3, s.units.map((u) => li(esc(u.label), u.rented
      ? `${esc(u.tenant)} · <span class="num">${money(u.rent)}</span> ${freqLabel(u.freq)} · ${u.doc?.status === "done" ? "lease attached" : "no lease file"}`
      : "Vacant")))}
    ${saveError(s)}
  </div>`;
}

function renderA(s) {
  if (s.phase === "start") return emptyPortfolio("Add property");
  if (s.phase === "landed") return landed(s);
  const st = A_STEPS[s.step], last = s.step === A_STEPS.length - 1;
  return `<header class="page-head"><div><p style="margin:0 0 .25rem"><button type="button" class="btn link" data-action="restart">${icon("left")}Cancel</button></p><h1>Add a property</h1></div></header>
  <div class="wiz">
    <nav aria-label="Setup steps"><ol class="rail">
      ${A_STEPS.map((x, i) => {
        const state = i < s.step ? "done" : i === s.step ? "current" : "";
        const inner = `<span class="bullet">${i < s.step ? icon("check") : i + 1}</span>${x.title}`;
        return `<li>${i < s.step ? `<button type="button" class="step done" data-action="goto" data-arg="${i}">${inner}<span class="sr-only"> (complete)</span></button>` : `<span class="step ${state}"${i === s.step ? ' aria-current="step"' : ""}>${inner}</span>`}</li>`;
      }).join("")}
    </ol></nav>
    <div>
      <div class="wiz-mobile"><div class="meter-row"><span class="label">Step ${s.step + 1} of ${A_STEPS.length} · ${st.title}</span></div><div class="iv-progress" aria-hidden="true"><i style="width:${((s.step + 1) / A_STEPS.length) * 100}%"></i></div></div>
      <form class="card step-card fade-in" data-form="a" novalidate>
        <h2 tabindex="-1" data-focus><span class="sr-only">Step ${s.step + 1} of ${A_STEPS.length}: </span>${st.title}</h2>
        <p class="lede">${st.lede}</p>
        ${st.body(s)}
        <div class="step-foot">
          ${s.step > 0 ? `<button type="button" class="btn ghost" data-action="back">${icon("left")}Back</button>` : "<span></span>"}
          ${last ? saveButton(s, "Create property") : `<button type="submit" class="btn">Continue${icon("right")}</button>`}
        </div>
      </form>
    </div>
  </div>`;
}

/* ============================================================
   Approach B — interview, one question per screen
   ============================================================ */
function bSequence(s) {
  const q = ["address", "acquired", "owners", "ownerNames", "layout"];
  if (s.layout === "custom") q.push("unitsCustom");
  s.units.forEach((u, i) => { q.push("rented:" + i); if (u.rented === true) q.push("lease:" + i, "doc:" + i); });
  q.push("review");
  return q;
}

const B_Q = {
  address: { title: () => "Where is the rental property?", why: () => "We use the address to label your records and your T776.", body: addressFields,
    validate: (s) => vProperty(s, ["property.line1", "property.city", "property.postal"]) },
  acquired: { title: () => "When did you take ownership?", why: () => "Usually your closing date. Ownership shares start from this day.",
    body: (s) => `<div style="max-width:16rem">${field(s, "property.acquired", "Acquisition date", { type: "date", max: TODAY })}</div>`,
    validate: (s) => vProperty(s, ["property.acquired"]) },
  owners: { title: () => "Who owns it?", why: () => "Each owner reports their share of the rental income and expenses.", auto: true,
    body: (s) => choiceGroup(s, "ownerMode", "Who owns it?", [["solo", "Just me", "You own 100%"], ["partner", "Me and one other person, equally", "Spouse, partner or co-owner — 50% each"], ["multi", "Several owners or unequal shares", "You’ll enter each share"]], s.ownerMode, { action: "owner-mode" }),
    validate: vOwnerMode },
  ownerNames: { title: (s) => s.ownerMode === "solo" ? "What’s your name?" : s.ownerMode === "partner" ? "Who are the two owners?" : "Who are the owners, and what’s each share?",
    why: (s) => s.ownerMode === "multi" ? "Shares must add up to 100%." : "As the names should appear on each owner’s T776.",
    body: ownersEditor, validate: vOwners },
  layout: { title: () => "How is it rented out?", why: () => "We’ll create a unit for each rentable space. You can rename them.", auto: true,
    body: (s) => choiceGroup(s, "layout", "How is it rented out?", Object.entries(LAYOUTS).map(([k, v]) => [k, v.label, v.sub]), s.layout, { action: "layout" }),
    validate: vLayout },
  unitsCustom: { title: () => "Name each unit", why: () => "Use whatever you and your tenants call them.", body: unitsEditor, validate: vUnits },
  rented: { title: (s, i) => s.units.length === 1 ? "Is it rented right now?" : `Is the ${s.units[i].label.toLowerCase()} unit rented right now?`,
    why: () => "Vacant is fine — you can add a tenant whenever it’s rented.", auto: true,
    body: (s, i) => choiceGroup(s, `units.${i}.rented`, "Rented right now?", [["yes", "Yes, it’s rented"], ["no", "No, it’s vacant"]], s.units[i].rented === null ? null : s.units[i].rented ? "yes" : "no", { action: "rented-q" }),
    validate: vRented },
  lease: { title: (s, i) => `Tell us about the ${s.units[i].label.toLowerCase()} lease`, why: () => "Rent payments you record later will default to this tenant.",
    body: (s, i) => leaseFields(s, i), validate: vLease },
  doc: { title: (s, i) => `Do you have ${s.units[i].tenant.split(/[ ,&]/)[0] || "the tenant"}’s signed lease handy?`,
    why: () => "Optional now. It backs up your rent records if CRA ever asks.",
    body: (s, i) => docDrop(s, i, { title: "Upload the signed lease" }), validate: vDoc,
    nextLabel: (s, i) => s.units[i].doc?.status === "done" ? "Continue" : "Skip for now" },
  review: { title: () => "Here’s what we’ll set up", why: () => "Check it over. Nothing is saved until you create the property.", body: reviewB, validate: (s) => vProperty(s, ["property.name"]) },
};

function reviewB(s) {
  const p = s.property, rented = s.units.filter((u) => u.rented);
  const ownersText = s.ownerMode === "solo" ? `${esc(s.owners[0].name)} owns 100%` : s.owners.map((o) => `${esc(o.name)} ${round2(num(o.share))}%`).join(", ");
  const jump = (q) => `<button type="button" class="btn link" data-action="jump" data-arg="${q}">Change</button>`;
  return `<div class="stack">
    ${field(s, "property.name", "Property name", { hint: "Shown across your workspace." })}
    <ul class="sentences">
      <li>${icon("check")}<div>${esc(p.line1)}, ${esc(p.city)}, ${esc(p.province)}, acquired ${fmtDate(p.acquired)}.</div>${jump("address")}</li>
      <li>${icon("check")}<div>${ownersText}.</div>${jump("ownerNames")}</li>
      <li>${icon("check")}<div>${plural(s.units.length, "unit")}: ${s.units.map((u) => esc(u.label)).join(", ")}.</div>${jump("layout")}</li>
      ${s.units.map((u, i) => u.rented
        ? `<li class="${u.doc?.status === "done" ? "" : "warn"}">${icon(u.doc?.status === "done" ? "check" : "dot")}<div>${esc(u.label)}: ${esc(u.tenant)} pays <span class="num">${money(u.rent)}</span> ${freqLabel(u.freq)} since ${fmtDate(u.start)}. ${u.doc?.status === "done" ? "Lease attached." : "No lease file yet."}</div>${jump("lease:" + i)}</li>`
        : `<li>${icon("check")}<div>${esc(u.label)} is vacant.</div>${jump("rented:" + i)}</li>`).join("")}
    </ul>
    ${rented.length === 0 ? `<p class="hint">No active leases yet — that’s fine for setup.</p>` : ""}
    ${saveError(s)}
  </div>`;
}

function receipt(s) {
  const p = s.property;
  const row = (label, val) => `<div><dt>${label}</dt><dd>${val || '<span class="pending">—</span>'}</dd></div>`;
  return `<aside class="receipt" aria-label="Captured so far"><h3>So far</h3><dl>
    ${row("Address", p.line1 && `${esc(p.line1)}${p.city ? ", " + esc(p.city) : ""}`)}
    ${row("Acquired", fmtDate(p.acquired))}
    ${row("Owners", s.owners.some((o) => o.name.trim()) && s.owners.filter((o) => o.name.trim()).map((o) => `${esc(o.name)} <span class="num" style="color:var(--muted-fg);font-weight:400">${round2(num(o.share)) || 0}%</span>`).join("<br>"))}
    ${row("Units", s.units.length && s.units.map((u) => `${esc(u.label)}${u.rented === true && u.tenant ? ` <span style="color:var(--muted-fg);font-weight:400">· ${esc(u.tenant)}</span>` : u.rented === false ? ' <span style="color:var(--muted-fg);font-weight:400">· vacant</span>' : ""}`).join("<br>"))}
  </dl></aside>`;
}

function renderB(s) {
  if (s.phase === "start") return emptyPortfolio("Add property");
  if (s.phase === "landed") return landed(s);
  const seq = bSequence(s);
  s.step = Math.min(s.step, seq.length - 1);
  const [key, idx] = seq[s.step].split(":"); const i = idx == null ? undefined : Number(idx);
  const q = B_Q[key], last = key === "review";
  const nextLabel = q.nextLabel ? q.nextLabel(s, i) : "Continue";
  return `<div class="iv">
    <form class="fade-in" data-form="b" novalidate>
      <div class="iv-top">
        <button type="button" class="btn ghost" data-action="${s.step === 0 ? "restart" : "back"}" style="padding:0 .5rem">${icon("left")}${s.step === 0 ? "Cancel" : "Back"}</button>
        <div class="iv-progress" aria-hidden="true"><i style="width:${(s.step / (seq.length - 1)) * 100}%"></i></div>
        <span class="iv-count num">${s.step + 1} / ${seq.length}</span>
      </div>
      <h2 tabindex="-1" data-focus>${q.title(s, i)}</h2>
      <p class="why">${q.why(s, i)}</p>
      ${q.body(s, i)}
      <div class="iv-actions">
        ${last ? saveButton(s, "Create property") : q.auto ? "" : `<button type="submit" class="btn lg">${nextLabel}${icon("right")}</button>`}
        ${q.auto ? `<p class="hint">Choose an answer to continue.</p>` : ""}
      </div>
    </form>
    ${last ? "" : receipt(s)}
  </div>`;
}

/* ============================================================
   Approach C — short sheet, then an in-place checklist
   ============================================================ */
const C_TASKS = [
  { id: "units", title: "Units", sub: (s) => s.cDone.units ? s.units.map((u) => u.label).join(", ") : "Each rentable space",
    body: (s) => `${choiceGroup(s, "layout", "How is it rented out?", Object.entries(LAYOUTS).map(([k, v]) => [k, v.label]), s.layout, { action: "layout", cols: true })}
      ${s.layout ? unitsEditor(s) : ""}`, validate: vUnits },
  { id: "ownership", title: "Ownership", sub: (s) => s.cDone.ownership ? s.owners.map((o) => `${o.name} ${round2(num(o.share))}%`).join(", ") : `Shares from ${fmtDate(s.property.acquired)}`,
    body: (s) => `${choiceGroup(s, "ownerMode", "Who owns this property?", [["solo", "Just me"], ["partner", "Two owners, equally"], ["multi", "Unequal or more owners"]], s.ownerMode, { action: "owner-mode", cols: true })}
      ${s.ownerMode ? ownersEditor(s) : ""}`, validate: vOwners },
  { id: "leases", title: "Tenants & leases", sub: (s) => s.cDone.leases ? s.units.map((u) => u.rented ? `${u.label}: ${u.tenant}` : `${u.label}: vacant`).join(" · ") : "Who’s renting each unit, plus the signed lease",
    body: (s) => s.units.length === 0 ? `<p class="hint">Add units first.</p>` : s.units.map((u, i) => `<div class="lease-row">
        <div class="lease-row-head"><strong>${esc(u.label)}</strong>${rentedToggle(s, i)}</div>
        ${u.rented === true ? `${leaseFields(s, i, true)}${docDrop(s, i, { title: "Signed lease (optional)" })}` : ""}
      </div>`).join(""), validate: vLeases },
];

function renderC(s) {
  if (s.phase === "start") return emptyPortfolio("Add property");
  const done = 1 + C_TASKS.filter((t) => s.cDone[t.id]).length, total = 1 + C_TASKS.length;
  const complete = done === total;
  const taskRow = (t, n) => {
    const isDone = s.cDone[t.id], open = s.cOpen === t.id;
    return `<section class="task${isDone ? " done" : ""}${open ? " open" : ""}" aria-labelledby="${fid("task-" + t.id)}">
      <div class="task-head"><span class="t-ico" aria-hidden="true">${isDone ? icon("check") : n}</span>
        <div class="t-text"><strong id="${fid("task-" + t.id)}">${t.title}${isDone ? '<span class="sr-only"> (complete)</span>' : ""}</strong><span class="t-sub">${esc(t.sub(s))}</span></div>
        ${open ? "" : `<button type="button" class="btn ${isDone ? "ghost" : "outline"}" data-action="c-open" data-arg="${t.id}">${isDone ? "Edit" : "Start"}<span class="sr-only"> ${t.title}</span></button>`}
      </div>
      ${open ? `<form class="task-body fade-in" data-form="c" data-task="${t.id}" novalidate><h3 class="sr-only" tabindex="-1" data-focus>${t.title}</h3>${t.body(s)}
        <div><button type="submit" class="btn">${C_TASKS.every((x) => x.id === t.id || s.cDone[x.id]) ? "Finish setup" : "Save and continue"}</button></div></form>` : ""}
    </section>`;
  };
  return `${propertyHeader(s, complete ? `<span class="badge ready">${icon("check")}Setup complete</span>` : `<span class="badge review">${plural(total - done, "setup step")} left</span>`)}
  <div class="card setup" style="margin-bottom:1rem">
    <div class="setup-head"><div><h2>${complete ? "Setup complete" : "Finish setting up"}</h2><p>${complete ? "Everything needed to track and file this property is in place. Edit anytime." : "Do these once. Rent and expenses use them to land on the right unit and owner."}</p></div>
      <div style="display:grid;gap:.375rem;justify-items:end"><span class="num hint">${done} of ${total} done</span><div class="setup-progress" aria-hidden="true"><i style="width:${(done / total) * 100}%"></i></div></div></div>
    <section class="task done"><div class="task-head"><span class="t-ico" aria-hidden="true">${icon("check")}</span><div class="t-text"><strong>Property details<span class="sr-only"> (complete)</span></strong><span class="t-sub">Address and acquisition date</span></div></div></section>
    ${C_TASKS.map((t, n) => taskRow(t, n + 2)).join("")}
  </div>
  <div class="card muted-section">
    <div class="preview-row"><strong>Rent payments</strong><span style="margin-left:auto">${complete ? "Ready to record" : "Easier once tenants are set up"}</span></div>
    <div class="preview-row"><strong>Expenses &amp; non-rent income</strong><span style="margin-left:auto">${complete ? "Ready to record" : "Split by owner shares"}</span></div>
    <div class="preview-row"><strong>Mortgage payments</strong><span style="margin-left:auto">Anytime</span></div>
  </div>
  ${complete ? `<div class="callout boundary" style="margin-top:1rem">${icon("info")}<div>Prototype boundary: these rows stand in for the existing workspace sections. <button type="button" class="btn link" data-action="restart">Start over</button></div></div>` : ""}`;
}

function cSheet(s) {
  return `<div class="scrim" data-action="sheet-close-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-desc">
    <form data-form="sheet" novalidate style="display:contents">
      <div class="sheet-head"><div><h2 id="sheet-title" tabindex="-1" data-focus>Add property</h2><p id="sheet-desc">Just the address and date. You’ll finish setup on the property page.</p></div>
        <button type="button" class="btn ghost" data-action="sheet-close" aria-label="Close">${icon("x")}</button></div>
      <div class="sheet-body"><div class="stack">${addressFields(s)}
        ${field(s, "property.acquired", "Acquisition date", { type: "date", max: TODAY, hint: "Your closing date." })}
        ${saveError(s)}</div></div>
      <div class="sheet-foot"><button type="button" class="btn outline" data-action="sheet-close">Cancel</button>
        ${s.save === "saving" ? `<button type="button" class="btn" disabled aria-disabled="true"><span class="spinner" aria-hidden="true"></span>Creating…</button>` : `<button type="submit" class="btn">Create property</button>`}</div>
    </form></div></div>`;
}

/* ============================================================
   Approach D — recommended: A's sections + B's questions
   ============================================================ */
function dSequence(s) { return ["property", "ownership", "units", ...s.units.map((_, i) => "unit:" + i), "review"]; }
const dSection = (k) => D_SECTIONS.findIndex((x) => x.key === k.split(":")[0]);
const noErrors = (e) => Object.keys(e).length === 0;

const D_Q = {
  property: { title: () => "Where is it, and when did you take ownership?", why: () => "Ownership shares start on your acquisition date — usually the closing date.",
    body: (s) => `<div class="stack">${addressFields(s)}<div style="max-width:16rem">${field(s, "property.acquired", "Acquisition date", { type: "date", max: TODAY })}</div></div>`,
    validate: (s) => vProperty(s) },
  ownership: { title: () => "Who owns it?", why: (s) => `Each owner reports their share of the income and expenses. Shares apply from ${fmtDate(s.property.acquired)}.`,
    body: (s) => `<div class="stack">
      ${choiceGroup(s, "ownerMode", "Who owns it?", [["solo", "Just me", "You own 100%"], ["partner", "Me and one other person, equally", "Spouse, partner or co-owner — 50% each"], ["multi", "Several owners or unequal shares", "You’ll enter each share"]], s.ownerMode, { action: "owner-mode" })}
      ${s.ownerMode ? `<div class="fade-in">${ownersEditor(s)}</div><p class="hint">Ownership changed after you bought it? Add that history later from the property page.</p>` : ""}</div>`,
    validate: vOwners },
  units: { title: () => "How is it rented out?", why: () => "We’ll create a unit for each rentable space so rent lands in the right place. Rename them if you like.",
    body: (s) => `<div class="stack">
      ${choiceGroup(s, "layout", "How is it rented out?", Object.entries(LAYOUTS).map(([k, v]) => [k, v.label, v.sub]), s.layout, { action: "layout", cols: true })}
      ${s.layout ? `<div class="fade-in">${unitsEditor(s)}</div>` : ""}</div>`,
    validate: vUnits },
  unit: { eyebrow: (s, i) => s.units.length > 1 ? `Unit ${i + 1} of ${s.units.length}${s.units[i].label === `Unit ${i + 1}` ? "" : ` · ${esc(s.units[i].label)}`}` : esc(s.units[i].label),
    title: () => "Is it rented right now?", why: () => "Vacant is fine — add a tenant whenever it’s rented.",
    body: (s, i) => { const u = s.units[i]; return `<div class="stack">
      ${choiceGroup(s, `units.${i}.rented`, "Is it rented right now?", [[`${i}:yes`, "Yes, it’s rented", "Add the tenant and rent"], [`${i}:no`, "No, it’s vacant", "Nothing else needed"]], u.rented === null ? null : `${i}:${u.rented ? "yes" : "no"}`, { action: "rented", cols: true })}
      ${u.rented === true ? `<div class="stack fade-in">${leaseFields(s, i)}<div><p class="label" style="margin-bottom:.375rem">Signed lease <span class="opt">(optional)</span></p>${docDrop(s, i)}</div></div>` : ""}</div>`; },
    validate: (s, i) => ({ ...vRented(s, i), ...vLease(s, i), ...vDoc(s, i) }) },
  review: { title: () => "Check it over", why: () => "Nothing is saved until you create the property.", body: (s) => reviewD(s), validate: () => ({}) },
};

/* Rail sections. `done` re-runs the validators, so an edit that breaks a section un-ticks it. */
const D_SECTIONS = [
  { key: "property", title: "Property", first: () => "property", done: (s) => noErrors(vProperty(s)),
    sum: (s) => `${esc(s.property.line1)}<br>Acquired ${fmtDate(s.property.acquired)}` },
  { key: "ownership", title: "Ownership", first: () => "ownership", done: (s) => noErrors(vOwners(s)),
    sum: (s) => s.owners.map((o) => `${esc(o.name)} <span class="num">${round2(num(o.share))}%</span>`).join("<br>") },
  { key: "units", title: "Units", first: () => "units", done: (s) => noErrors(vUnits(s)),
    sum: (s) => s.units.map((u) => esc(u.label)).join(", ") },
  { key: "unit", title: "Tenants & leases", first: (s) => s.units.length ? "unit:0" : "units", done: (s) => s.units.length > 0 && noErrors(vLeases(s)),
    sum: (s, here) => s.units.map((u, i) => { const line = `${esc(u.label)} · ${u.rented === true ? esc(u.tenant) || "rented" : u.rented === false ? "vacant" : "—"}`; return i === here ? `<b>${line}</b>` : line; }).join("<br>") },
  { key: "review", title: "Review", first: () => "review" },
];

/* First screen that still fails validation; review when everything passes. */
function dFirstIncomplete(s) {
  const seq = dSequence(s);
  const n = seq.findIndex((k) => { const [key, idx] = k.split(":"); return key !== "review" && !noErrors(D_Q[key].validate(s, idx == null ? undefined : Number(idx))); });
  return n === -1 ? seq.length - 1 : n;
}
function dGo(s, step) { s.step = step; s.dSecMax = Math.max(s.dSecMax, dSection(dSequence(s)[step])); }

function dRail(s, cur, unitIdx) {
  return `<ol class="rail d">${D_SECTIONS.map((x, n) => {
    const visited = n <= s.dSecMax, here = n === cur, isReview = n === D_SECTIONS.length - 1;
    const done = visited && !here && !isReview && x.done(s);
    const sum = done ? x.sum(s) : here && x.key === "unit" ? x.sum(s, unitIdx) : "";
    const inner = `<span class="bullet">${done ? icon("check") : n + 1}</span><span class="step-text">${x.title}${sum ? `<span class="step-sum">${sum}</span>` : ""}</span>`;
    if (visited && !here) return `<li><button type="button" class="step${done ? " done" : ""}" data-action="jump" data-arg="${x.first(s)}">${inner}${done ? '<span class="sr-only"> (complete)</span>' : ""}</button></li>`;
    return `<li><span class="step${here ? " current" : ""}"${here ? ' aria-current="step"' : ""}>${inner}</span></li>`;
  }).join("")}</ol>`;
}

function reviewD(s) {
  const p = s.property;
  const sec = (title, key, items) => `<section class="review-sec"><div class="review-sec-head"><h3>${title}</h3><button type="button" class="btn link" data-action="jump" data-arg="${key}">Edit<span class="sr-only"> ${title}</span></button></div><ul>${items.join("")}</ul></section>`;
  const li = (a, b) => `<li><span>${a}</span><span>${b}</span></li>`;
  const missing = s.units.filter((u) => u.rented && u.doc?.status !== "done");
  return `<div class="stack">
    ${field(s, "property.name", "Property name", { hint: "Shown across your workspace." })}
    <div>
      ${sec("Property", "property", [li(esc(p.line1), `${esc(p.city)}, ${esc(p.province)} ${esc(p.postal)}`), li("Acquired", fmtDate(p.acquired))])}
      ${sec("Ownership", "ownership", s.owners.map((o) => li(esc(o.name), `<span class="num">${round2(num(o.share))}%</span>`)))}
      ${sec("Units", "units", s.units.map((u) => li(esc(u.label), esc(u.type))))}
      ${sec("Tenants & leases", "unit:0", s.units.map((u) => li(esc(u.label), u.rented
        ? `${esc(u.tenant)} · <span class="num">${money(u.rent)}</span> ${freqLabel(u.freq)} since ${fmtDate(u.start)}`
        : "Vacant")))}
    </div>
    ${missing.length ? `<div class="callout info">${icon("info")}<div>${plural(missing.length, "signed lease")} not attached yet (${missing.map((u) => esc(u.label)).join(", ")}). That’s fine — you can add it from the property page.</div></div>` : ""}
    ${saveError(s)}
  </div>`;
}

/* Saved part-way through: the checklist that sits on the property page until setup is done. */
function partialD(s) {
  const rows = D_SECTIONS.slice(0, -1), done = rows.filter((x) => x.done(s)).length;
  return `${propertyHeader(s, `<span class="badge review">${plural(rows.length - done, "setup step")} left</span>`)}
  <div class="card setup fade-in" style="max-width:44rem">
    <div class="setup-head"><div><h2>Finish setting up</h2><p>Saved. Pick up where you left off whenever you’re ready.</p></div>
      <button type="button" class="btn" data-action="resume">Continue setup${icon("right")}</button></div>
    ${rows.map((x, n) => { const ok = x.done(s); return `<section class="task${ok ? " done" : ""}"><div class="task-head"><span class="t-ico" aria-hidden="true">${ok ? icon("check") : n + 1}</span>
      <div class="t-text"><strong>${x.title}${ok ? '<span class="sr-only"> (complete)</span>' : ""}</strong><span class="t-sub">${ok ? x.sum(s).replace(/<br>/g, " · ") : "To do"}</span></div></div></section>`; }).join("")}
  </div>
  <div class="callout boundary" style="margin-top:1rem;max-width:44rem">${icon("info")}<div>Prototype boundary: in the product this card sits at the top of the property page until setup is complete. <button type="button" class="btn link" data-action="restart">Start over</button></div></div>`;
}

function renderD(s) {
  if (s.phase === "start") return emptyPortfolio("Add property");
  if (s.phase === "landed") return landed(s);
  if (s.phase === "partial") return partialD(s);
  const seq = dSequence(s);
  s.step = Math.min(s.step, seq.length - 1);
  const [key, idx] = seq[s.step].split(":"); const i = idx == null ? undefined : Number(idx);
  const q = D_Q[key], cur = dSection(key), last = key === "review";
  const primary = last ? saveButton(s, "Create property")
    : s.save === "saving" ? `<button type="button" class="btn" disabled aria-disabled="true"><span class="spinner" aria-hidden="true"></span>Saving…</button>`
    : `${s.step > 0 ? `<button type="button" class="btn ghost" data-action="save-later">Save and finish later</button>` : ""}
       <button type="submit" class="btn">${s.dSecMax === D_SECTIONS.length - 1 ? "Back to review" : "Continue"}${icon("right")}</button>`;
  return `<header class="page-head"><div><p style="margin:0 0 .25rem"><button type="button" class="btn link" data-action="restart">${icon("left")}Cancel</button></p><h1>Add a property</h1></div></header>
  <div class="wiz">
    <nav aria-label="Setup progress">${dRail(s, cur, i)}</nav>
    <div>
      <div class="wiz-mobile"><span class="label">Step ${cur + 1} of ${D_SECTIONS.length} · ${D_SECTIONS[cur].title}</span><div class="iv-progress" aria-hidden="true"><i style="width:${((cur + 1) / D_SECTIONS.length) * 100}%"></i></div></div>
      <form class="card step-card q fade-in" data-form="d" novalidate>
        ${q.eyebrow ? `<p class="eyebrow">${q.eyebrow(s, i)}</p>` : ""}
        <h2 tabindex="-1" data-focus>${q.title(s, i)}</h2>
        <p class="lede">${q.why(s, i)}</p>
        ${q.body(s, i)}
        ${last ? "" : saveError(s)}
        <div class="step-foot">
          ${s.step > 0 ? `<button type="button" class="btn ghost" data-action="back">${icon("left")}Back</button>` : "<span></span>"}
          <div class="foot-right">${primary}</div>
        </div>
      </form>
    </div>
  </div>`;
}

/* ============================================================
   Render + focus management
   ============================================================ */
let sheetTrigger = null;
function render({ focus = null } = {}) {
  const s = S();
  document.querySelectorAll(".tab").forEach((t) => {
    const on = t.dataset.approach === current;
    t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
  });
  document.getElementById("stage").setAttribute("aria-labelledby", "tab-" + current);
  document.getElementById("hypothesis").innerHTML = HYPOTHESES[current];
  document.getElementById("stage").innerHTML = { a: renderA, b: renderB, c: renderC, d: renderD }[current](s);
  document.getElementById("portal").innerHTML = current === "c" && s.sheetOpen ? cSheet(s) : "";
  const root = s.sheetOpen && current === "c" ? document.getElementById("portal") : document.getElementById("stage");
  if (focus === "heading") root.querySelector("[data-focus]")?.focus({ preventScroll: false });
  else if (focus === "error") {
    const el = root.querySelector('[aria-invalid="true"]');
    if (el) { (el.matches("[role=radiogroup]") ? el.querySelector("[tabindex='0']") : el).focus(); }
  } else if (typeof focus === "string") root.querySelector(focus)?.focus();
}

function applyErrors(s, e) {
  s.errors = e;
  const n = Object.keys(e).length;
  if (n) announce(`${plural(n, "field")} need${n === 1 ? "s" : ""} attention.`);
  return n === 0;
}

/* Simulated create: 900ms of saving, then success or the failure toggle. */
function create(s, onDone) {
  s.save = "saving"; render();
  announce("Creating property…");
  setTimeout(() => {
    if (failSave) { s.save = "error"; render({ focus: "[data-action='create'], [data-action='save-later'], [data-form='sheet'] [type='submit']" }); announce("The property could not be saved."); return; }
    s.save = "idle"; onDone(); render({ focus: "heading" }); announce("Property created.");
  }, 900);
}

/* ---------- Owner/unit structural actions shared by all approaches ---------- */
function setOwnerMode(s, mode) {
  if (s.ownerMode === mode) return;
  const names = s.owners.map((o) => o.name);
  s.ownerMode = mode;
  if (mode === "solo") s.owners = [newOwner(names[0] || "", 100)];
  else if (mode === "partner") s.owners = [newOwner(names[0] || "", 50), newOwner(names[1] || "", 50)];
  else s.owners = s.owners.length === 2 ? s.owners : [newOwner(names[0] || "", ""), newOwner(names[1] || "", "")];
}
function setLayout(s, key) {
  if (s.layout === key) return;
  s.layout = key;
  // Keep tenant details already entered for units in the same position.
  s.units = LAYOUTS[key].units.map(([label, type], i) => Object.assign(newUnit(label, type), s.units[i] ? { rented: s.units[i].rented, tenant: s.units[i].tenant, start: s.units[i].start, rent: s.units[i].rent, freq: s.units[i].freq, doc: s.units[i].doc } : {}));
}

function handleFile(i, file) {
  const s = S(), u = s.units[i];
  delete s.errors[`units.${i}.doc`];
  const okType = file.type === "application/pdf" || file.type.startsWith("image/");
  if (!okType) u.doc = { name: file.name, size: file.size, status: "error", error: "Lease files must be a PDF or an image." };
  else if (file.size > MAX_BYTES) u.doc = { name: file.name, size: file.size, status: "error", error: "That file is over 20 MB." };
  else {
    u.doc = { name: file.name, size: file.size, status: "uploading" };
    setTimeout(() => {
      if (u.doc?.status !== "uploading") return;
      u.doc.status = "done"; delete s.errors[`units.${i}.doc`]; render(); announce(`${file.name} uploaded.`);
    }, 1100);
  }
  render({ focus: `[data-action='remove-doc'][data-arg='${i}'], [data-action='pick-file'][data-arg='${i}']` });
  announce(u.doc.status === "error" ? u.doc.error : `Uploading ${file.name}`);
}

/* ---------- Events ---------- */
function onBind(ev) {
